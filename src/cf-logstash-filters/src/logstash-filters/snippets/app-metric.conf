##---------------------------------------------------------------------
# Parses message with app metric data.                                |
##---------------------------------------------------------------------
# make sure there is a string value for metrics_sd_id
if ( "" in [metrics_sd_id] ) {
  mutate {
    add_tag => [ "app_metric" ]
    replace => { "@type" => "app_metric"}
  }

  # Copy metric values to containermetric fields (using else-if for efficiency)
  if [metrics_sd_params][name] == "cpu" and [metrics_sd_params][unit] == "percentage" {
    mutate { copy => { "[metrics_sd_params][value]" => "[containermetric][cpu_percentage]" } }
  } else if [metrics_sd_params][name] == "memory" and [metrics_sd_params][unit] == "bytes" {
    mutate { copy => { "[metrics_sd_params][value]" => "[containermetric][memory_bytes]" } }
  } else if [metrics_sd_params][name] == "memory_quota" and [metrics_sd_params][unit] == "bytes" {
    mutate { copy => { "[metrics_sd_params][value]" => "[containermetric][memory_bytes_quota]" } }
  } else if [metrics_sd_params][name] == "disk" and [metrics_sd_params][unit] == "bytes" {
    mutate { copy => { "[metrics_sd_params][value]" => "[containermetric][disk_bytes]" } }
  } else if [metrics_sd_params][name] == "disk_quota" and [metrics_sd_params][unit] == "bytes" {
    mutate { copy => { "[metrics_sd_params][value]" => "[containermetric][disk_bytes_quota]" } }
  }

  # Rename remaining fields and cleanup (consolidated mutate)
  mutate {
    rename => { "[metrics_sd_params][unit]"  => "[containermetric][unit]" }
    rename => { "[metrics_sd_params][delta]" => "[containermetric][delta]" }
    rename => { "[metrics_sd_params][name]"  => "[containermetric][name]" }
    rename => { "[metrics_sd_params][total]" => "[containermetric][total]" }
    rename => { "[metrics_sd_params][value]" => "[containermetric][value]" }
    remove_field => [ "metrics_sd_id", "@message" ]
  }
}
