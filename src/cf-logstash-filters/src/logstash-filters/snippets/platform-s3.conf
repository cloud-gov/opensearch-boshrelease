##---------------------------------------------
# Platform S3 conf. Parses JSON platform logs.|
##---------------------------------------------

# Parse the incoming message as JSON
json
{
    source => "message"
    target => "parsed_json"
    tag_on_failure => ["_jsonparsefailure"]
}

# If JSON parsing succeeded, extract fields
if "_jsonparsefailure" not in [tags] {
    # Move parsed JSON fields to appropriate locations
    if [parsed_json][@timestamp] {
        date {
            match => ["[parsed_json][@timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd'T'HH:mm:ssZ"]
            target => "@timestamp"
        }
    }

    if [parsed_json][timestamp] {
        date {
            match => ["[parsed_json][timestamp]", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd'T'HH:mm:ssZ", "UNIX_MS"]
            target => "@timestamp"
        }
    }

    # Extract message field
    if [parsed_json][message] {
        mutate {
            rename => {"[parsed_json][message]" => "@message"}
        }
    } else if [parsed_json][@message] {
        mutate {
            rename => {"[parsed_json][@message]" => "@message"}
        }
    } else {
        mutate {
            rename => {"message" => "@message"}
        }
    }

    # Extract source information if present
    if [parsed_json][source] {
        mutate {
            rename => {"[parsed_json][source]" => "[@source][component]"}
        }
    }

    if [parsed_json][job] {
        mutate {
            rename => {"[parsed_json][job]" => "[@source][job]"}
        }
    }

    if [parsed_json][index] {
        mutate {
            rename => {"[parsed_json][index]" => "[@source][index]"}
        }
    }

    if [parsed_json][deployment] {
        mutate {
            rename => {"[parsed_json][deployment]" => "[@source][deployment]"}
        }
    }

    # Extract log level if present
    if [parsed_json][level] {
        mutate {
            rename => {"[parsed_json][level]" => "[@level]"}
        }
    } else if [parsed_json][log_level] {
        mutate {
            rename => {"[parsed_json][log_level]" => "[@level]"}
        }
    }

    # Move remaining parsed fields to root
    ruby {
        code => '
            parsed = event.get("parsed_json")
            if parsed.is_a?(Hash)
                parsed.each do |k, v|
                    # Skip fields we have already handled
                    next if ["@timestamp", "timestamp", "message", "@message", "source", "job", "index", "deployment", "level", "log_level"].include?(k)
                    event.set(k, v)
                end
            end
        '
    }

    mutate {
        remove_field => ["parsed_json"]
    }
} else {
    # JSON parsing failed, treat as plain text
    mutate {
        rename => {"message" => "@message"}
    }
}

# Set index type and metadata
mutate {
    add_field => { "@index_type" => "platform" }
    add_field => { "[@metadata][index]" => "platform" }
    add_field => { "@type" => "platform-s3" }
    add_field => { "[@source][type]" => "s3" }
    add_tag => "platform"
}
